[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jz-cli"
version = "0.1.0"
description = "A sleek terminal productivity CLI connecting Google Calendar and Canvas LMS"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "JZ Developer Team" }
]
keywords = ["cli", "tui", "productivity", "canvas-lms", "google-calendar", "textual"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Utilities"
]
dependencies = [
    "textual>=0.50.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "httpx>=0.24.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth>=2.20.0",
    "python-dateutil>=2.8.2",
]

[project.scripts]
jz = "jz_cli.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["jz_cli*"]
